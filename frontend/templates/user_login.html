<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Login • JalanJalan.AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
      .login-page { min-height: 100vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(180deg, #fff6f3 0%, #ffffff 100%); padding: 24px; }
      .login-card { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); padding: 28px; }
      .login-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
      .login-header img { width: 40px; height: 40px; }
      .login-title { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
      .login-subtitle { color: #666; margin: 4px 0 16px 0; font-size: 0.98rem; }
      .form-group { margin-bottom: 14px; }
      .form-label { display:block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
      .form-input { width: 100%; padding: 12px 14px; border: 1px solid #e6e6e6; border-radius: 10px; outline: none; background: #fafafa; transition: border 0.15s ease, background 0.15s ease, box-shadow 0.15s ease; }
      .form-input:focus { background: #fff; border-color: #ff6b35; box-shadow: 0 0 0 4px rgba(255,107,53,0.12); }
      .submit-btn { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #ff6b35; color: #fff; border: none; border-radius: 10px; padding: 12px 16px; font-weight: 700; cursor: pointer; transition: background 0.2s, transform 0.1s, box-shadow 0.2s; }
      .submit-btn:hover { background: #e55d2d; box-shadow: 0 8px 20px rgba(255,107,53,0.18); }
      .submit-btn:active { transform: translateY(1px); }
      .error-alert { background: #fff2f0; color: #c62828; border: 1px solid #ffcdd2; border-radius: 10px; padding: 10px 12px; margin: 8px 0 14px 0; font-size: 0.95rem; }
      .login-footer { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; color: #777; }
      .back-link { color: #666; text-decoration: none; }
      .back-link:hover { color: #ff6b35; }
    </style>
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" role="region" aria-labelledby="loginTitle">
        <div class="login-header">
          <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="JalanJalan.AI logo" />
          <h1 id="loginTitle" class="login-title">User Login</h1>
        </div>
        <p class="login-subtitle">Please sign in to plan your trip.</p>

        {% if error %}
          <div class="error-alert" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/user/login" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input id="username" class="form-input" type="text" name="username" placeholder="Enter username" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input id="password" class="form-input" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="submit-btn" aria-label="Sign in">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="15" r="1.5" fill="currentColor"/>
            </svg>
            Continue
          </button>
        </form>

        <div class="login-footer">
          <a href="{{ url_for('user_signup') }}" class="back-link">Create account →</a>
          <a href="{{ url_for('index') }}" class="back-link">Back to Home</a>
        </div>
      </section>
    </main>
  </body>
</html>
